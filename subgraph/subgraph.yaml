specVersion: 1.3.0
description: GFC Accountability Explorer transfer index for the public Base Sepolia tGFC pilot.
repository: https://github.com/GFConBase/gfc-accountability-explorer
schema:
  file: ./schema.graphql
indexerHints:
  # Accountability history benefits from retaining historical entity provenance.
  prune: never
dataSources:
  - kind: ethereum/contract
    name: GFCTestToken
    network: base-sepolia
    source:
      address: "0x7262Cca91938ede6bB6560F81104Aa410848e7f3"
      abi: GFCTestToken
      # No startBlock is asserted here because the current gfc-infrastructure
      # deployment record does not authenticate one. Add only after verification.
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: GFCTestToken
          file: ./abis/GFCTestToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
